<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gymix – Build the Body You Respect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  height:100%;
  scroll-snap-type:y mandatory;
  overflow-y:scroll;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f7f9ff;
  color:#111;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:72px;
  padding:0 40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(10px);
  z-index:1000;
}

.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
}

nav a{
  margin-left:26px;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
  color:#111;
}

/* SECTIONS */
section{
  height:100vh;
  scroll-snap-align:start;
  padding:120px 60px 60px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 🌈 HERO – LIGHT RAINBOW */
.hero{
  background:linear-gradient(
    135deg,
    #ffe9d6,
    #ffd6e8,
    #e6ddff,
    #d6f3ff,
    #d6ffe8
  );
  color:#111;
  flex-direction:column;
  text-align:center;
}

/* 🔥 HERO LOGO ANIMATION + BIGGER SIZE */
.hero-logo img{
  height:240px;
  opacity:0;
  animation:
    reveal 1.4s ease forwards,
    float 3.5s ease-in-out infinite 1.6s,
    glow 3s ease-in-out infinite alternate 1.6s;
  filter:drop-shadow(0 10px 25px rgba(0,0,0,.25));
}

/* Load animation */
@keyframes reveal{
  from{
    opacity:0;
    transform:translateY(40px) scale(.9);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* Idle animations */
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-16px)}
  100%{transform:translateY(0)}
}

@keyframes glow{
  from{filter:drop-shadow(0 10px 25px rgba(0,0,0,.25))}
  to{filter:drop-shadow(0 20px 45px rgba(0,0,0,.35))}
}

.hero p{
  font-size:30px;
  margin-top:26px;
  font-weight:800;
}

.hero .quote{
  margin-top:22px;
  font-size:36px;
  font-weight:900;
  letter-spacing:1px;
}

/* HERO BUTTONS */
.hero-buttons{
  margin-top:44px;
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
}

.btn-primary{
  padding:16px 48px;
  background:#000;
  color:#fff;
  text-decoration:none;
  font-size:18px;
  font-weight:900;
  border-radius:50px;
}

.btn-secondary{
  padding:16px 42px;
  background:rgba(0,0,0,0.08);
  color:#111;
  text-decoration:none;
  font-size:16px;
  font-weight:800;
  border-radius:50px;
  border:2px solid rgba(0,0,0,0.15);
}

/* WORKOUT */
.row{
  max-width:1400px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:80px;
}

.text h2{
  font-size:72px;
  font-weight:900;
}

.text p{
  margin-top:24px;
  font-size:22px;
  font-weight:600;
  max-width:620px;
}

/* VIDEO */
.video-box video{
  width:420px;
  height:420px;
  object-fit:contain;
  border-radius:24px;
  box-shadow:0 20px 50px rgba(0,0,0,0.15);
}

/* SUBSCRIBE */
.subscribe{
  background:linear-gradient(135deg,#00e5ff,#00ff9c);
  flex-direction:column;
  text-align:center;
}

.subscribe h2{
  font-size:82px;
  font-weight:900;
}

.price{
  font-size:64px;
  font-weight:900;
  margin:20px 0;
}

.subscribe a{
  margin-top:30px;
  padding:18px 70px;
  background:#000;
  color:#fff;
  text-decoration:none;
  font-size:18px;
  font-weight:900;
  border-radius:50px;
}

/* FOOTER */
.footer{
  padding:20px;
  text-align:center;
  font-size:12px;
  color:#666;
}

/* MOBILE */
@media(max-width:900px){
  section{padding:110px 24px}
  .row{flex-direction:column;text-align:center}
  .hero-logo img{height:160px}
  .hero p{font-size:22px}
  .hero .quote{font-size:24px}
  .text h2{font-size:44px}
  .video-box video{width:300px;height:300px}
}
</style>
</head>

<body>

<header>
  <div class="brand">GYMIX</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
    <a href="disclaimer.html">Disclaimer</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-logo">
    <img src="logo.png" alt="Gymix Logo">
  </div>

  <p>Train Smart. Get Strong.</p>
  <div class="quote">BUILD A BODY YOU RESPECT</div>

  <div class="hero-buttons">
    <a href="https://rozepay.com/YOUR_AUTOPAY_LINK" target="_blank" class="btn-primary">
      Subscribe ₹29
    </a>
    <a href="#workout1" class="btn-secondary">
      Explore Workouts ↓
    </a>
  </div>
</section>

</body>
</html>
